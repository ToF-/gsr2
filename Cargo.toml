[package]
name = "gsr"
version = "1.5.3"
edition = "2024"
authors = ["ToF-"]
default-run = "gsr"


[[bin]]
name = "gen_data"
path = "src/bin/gen_data.rs"

[[bin]]
name = "ctlg"
path = "src/bin/ctlg.rs"

[[bin]]
name = "gsr"
path = "src/bin/gsr.rs"

[[bin]]
name = "gsr_doc"
path = "src/bin/gsr_doc.rs"

[build-dependencies]
glib-build-tools = "0.22.8"

[dependencies]
chrono = "0.4.42"
clap = { version = "4.5.4", features = ["derive"] }
glib = "0.22.8"
glib-macros = "0.22.6"
gtk = { version = "0.10.1", package = "gtk4", features = ["v4_20"] }

image = "0.25.8"
itertools = "0.14.0"
lexpr = "0.2.7"
mermaid = "0.2.0"
mermaid-text = "0.57.0"
mime = "0.3.17"
palette_extract = "0.1.0"
rand = "0.9.2"
regex = "1.12.2"
rusqlite = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serial_test = "3.2.0"
thumbnailer = "0.5.1"
time-elapsed = "0.1.0"
time-format = "1.2.1"
toml = "0.9.8"
walkdir = "2.5.0"
